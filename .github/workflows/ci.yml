# main 브랜치에 push 하면
#  1) 백엔드·프론트엔드 이미지를 빌드해서 Docker Hub 에 push
#  2) k8s/ 폴더의 이미지 태그를 새 버전으로 바꿔 커밋
#  3) ArgoCD 가 바뀐 YAML 을 감지해서 클러스터에 자동 배포
name: Board CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"        # 워크플로가 직접 고친 YAML 커밋으로는 다시 실행되지 않도록
      - "**.md"

permissions:
  contents: write       # k8s/ 이미지 태그 수정 후 push 하기 위해 필요

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag (commit SHA 앞 7자리)
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/board-backend:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/board-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/board-frontend:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/board-frontend:latest

      - name: Update image tags in k8s manifests
        run: |
          sed -i "s#\(image: .*/board-backend:\).*#\1${TAG}#" k8s/backend.yaml
          sed -i "s#\(image: .*/board-frontend:\).*#\1${TAG}#" k8s/frontend.yaml
          sed -i "/name: APP_VERSION/{n;s#value: .*#value: \"${TAG}\"#}" k8s/backend.yaml
          git diff

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git commit -m "deploy: image tag ${TAG} [skip ci]" || echo "변경 없음"
          git push
