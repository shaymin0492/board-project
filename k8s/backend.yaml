# DB 비밀번호 (실습 편의상 Git에 둠 → 보고서 '제한사항'에 기록)
apiVersion: v1
kind: Secret
metadata:
  name: board-db-secret
type: Opaque
stringData:
  DB_PASSWORD: mysecretpassword
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: board-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: board-backend
    spec:
      containers:
      - name: flask
        image: shaymin0492/board-backend:3c839a0
        ports:
        - containerPort: 8001
        env:
        - name: DB_HOST
          value: "10.0.2.4"        # myserver01 에 직접 설치된 PostgreSQL
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "board"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: board-db-secret
              key: DB_PASSWORD
        - name: APP_VERSION
          value: "3c839a0"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: board-backend-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: board-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8001
