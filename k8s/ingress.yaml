# /api 로 시작하면 백엔드, 나머지는 프론트엔드로
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: board-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: board-backend-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: board-frontend-service
            port:
              number: 80
