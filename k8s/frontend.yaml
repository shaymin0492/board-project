apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: board-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: board-frontend
    spec:
      containers:
      - name: nginx
        image: shaymin0492/board-frontend:3c839a0
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: board-frontend-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: board-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
