<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>클라우드 네이티브 게시판</title>
  <style>
    :root { --main: #2563eb; --bg: #f5f7fb; --line: #e2e8f0; --text: #1e293b; --sub: #64748b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Pretendard", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--main); color: #fff; padding: 20px 16px; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; margin-bottom: 8px; }
    textarea { min-height: 90px; resize: vertical; }
    button { border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
    .primary { background: var(--main); color: #fff; }
    .ghost { background: #eef2ff; color: var(--main); }
    .danger { background: #fee2e2; color: #b91c1c; }
    .post h3 { margin: 0 0 6px; }
    .meta { color: var(--sub); font-size: 13px; margin-bottom: 10px; }
    .content { white-space: pre-wrap; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; }
    .empty { color: var(--sub); text-align: center; padding: 24px; }
    footer { text-align: center; color: var(--sub); font-size: 12px; padding: 24px 0; }
  </style>
</head>
<body>
  <header>
    <h1>클라우드 네이티브 게시판 v2</h1>
    <p>Frontend(nginx) · Backend(Flask) · PostgreSQL on Kubernetes</p>
  </header>

  <main>
    <section class="card">
      <h2 id="formTitle" style="margin-top:0;font-size:18px">새 글 작성</h2>
      <input id="author" placeholder="작성자 (비우면 익명)">
      <input id="title" placeholder="제목">
      <textarea id="content" placeholder="내용"></textarea>
      <div class="row">
        <button class="primary" id="submitBtn">등록</button>
        <button class="ghost" id="cancelBtn" style="display:none">수정 취소</button>
      </div>
    </section>

    <section id="list"></section>
  </main>

  <footer id="footer">backend 상태 확인 중...</footer>

  <script>
    const API = "/api/posts";
    let editingId = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    async function loadPosts() {
      const res = await fetch(API);
      const posts = await res.json();
      $("list").innerHTML = posts.length === 0
        ? '<div class="card empty">아직 게시글이 없습니다. 첫 글을 작성해보세요!</div>'
        : posts.map((p) => `
          <article class="card post">
            <h3>${esc(p.title)}</h3>
            <div class="meta">#${p.id} · ${esc(p.author)} · ${p.created_at}${p.updated_at !== p.created_at ? " (수정됨)" : ""}</div>
            <div class="content">${esc(p.content)}</div>
            <div class="row">
              <button class="ghost" onclick="startEdit(${p.id})">수정</button>
              <button class="danger" onclick="removePost(${p.id})">삭제</button>
            </div>
          </article>`).join("");
    }

    async function submitPost() {
      const body = { author: $("author").value, title: $("title").value, content: $("content").value };
      const res = await fetch(editingId ? `${API}/${editingId}` : API, {
        method: editingId ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) { alert((await res.json()).error || "요청 실패"); return; }
      resetForm();
      loadPosts();
    }

    async function startEdit(id) {
      const p = await (await fetch(`${API}/${id}`)).json();
      editingId = id;
      $("author").value = p.author; $("title").value = p.title; $("content").value = p.content;
      $("formTitle").textContent = `#${id} 글 수정`;
      $("submitBtn").textContent = "수정 완료";
      $("cancelBtn").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function removePost(id) {
      if (!confirm(`#${id} 글을 삭제할까요?`)) return;
      await fetch(`${API}/${id}`, { method: "DELETE" });
      if (editingId === id) resetForm();
      loadPosts();
    }

    function resetForm() {
      editingId = null;
      $("author").value = $("title").value = $("content").value = "";
      $("formTitle").textContent = "새 글 작성";
      $("submitBtn").textContent = "등록";
      $("cancelBtn").style.display = "none";
    }

    async function loadHealth() {
      try {
        const h = await (await fetch("/api/health")).json();
        $("footer").textContent = `backend ${h.version} · 응답한 파드: ${h.pod}`;
      } catch { $("footer").textContent = "backend 연결 실패"; }
    }

    $("submitBtn").onclick = submitPost;
    $("cancelBtn").onclick = resetForm;
    loadPosts();
    loadHealth();
  </script>
</body>
</html>
